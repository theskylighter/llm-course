<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="650" viewBox="0 0 1400 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M 0 0.5 L 9 3.5 L 0 6.5 Z" fill="#64748b"/>
    </marker>
    <style>
      .year-label { font-family: 'Patrick Hand', cursive; font-size: 14px; fill: #475569; text-anchor: middle; font-weight: bold; }
      .lane-label { font-family: 'Patrick Hand', cursive; font-size: 12px; fill: #475569; text-anchor: end; dominant-baseline: middle; }
      .paper-label { font-family: 'Patrick Hand', cursive; font-size: 12px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .paper-label-bold { font-family: 'Patrick Hand', cursive; font-size: 12px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; font-weight: bold; }
      .time-axis { stroke: #64748b; stroke-width: 2; stroke-dasharray: none; }
      .guide-line { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4,6; }
      .node-rect { rx: 8; ry: 8; }
    </style>
  </defs>
  
  <!-- Background grid (subtle) -->
  <rect width="1400" height="650" fill="#ffffff"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="80" x2="1300" y2="80"/>
  </g>
  
  <!-- Time axis (horizontal line with arrow) -->
  <line class="time-axis" x1="100" y1="80" x2="1300" y2="80" marker-end="url(#arrowhead)"/>
  <text x="70" y="85" class="year-label" style="font-size:16px;">TimeLine →</text>
  
  <!-- Year markers and vertical guide lines -->
  <g class="year-label">
    <text x="100" y="65">1991</text>
    <text x="200" y="65">2017</text>
    <text x="300" y="65">2018</text>
    <text x="420" y="65">2019</text>
    <text x="500" y="65">2020</text>
    <text x="600" y="65">2021</text>
    <text x="700" y="65">2022</text>
    <text x="800" y="65">2023</text>
    <text x="1000" y="65">2025</text>
    <text x="1180" y="65">2026</text>
  </g>
  <g class="guide-line">
    <line x1="100" y1="88" x2="100" y2="630"/>
    <line x1="200" y1="88" x2="200" y2="630"/>
    <line x1="300" y1="88" x2="300" y2="630"/>
    <line x1="420" y1="88" x2="420" y2="630"/>
    <line x1="500" y1="88" x2="500" y2="630"/>
    <line x1="600" y1="88" x2="600" y2="630"/>
    <line x1="700" y1="88" x2="700" y2="630"/>
    <line x1="800" y1="88" x2="800" y2="630"/>
    <line x1="1000" y1="88" x2="1000" y2="630"/>
    <line x1="1180" y1="88" x2="1180" y2="630"/>
  </g>
  
  <!-- Lane labels -->
  <g class="lane-label">
    <text x="90" y="150" style="line-height:1.2;">MoE / Conditional
Computation</text>
    <text x="90" y="250">Encoder / Seq2Seq</text>
    <text x="90" y="350" style="line-height:1.2;">Decoder-only /
Alignment</text>
    <text x="90" y="450" style="line-height:1.2;">Efficiency /
Attention</text>
    <text x="90" y="550" style="line-height:1.2;">Positional
Geometry</text>
  </g>
  
  <!-- Lane horizontal separators -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,4">
    <line x1="100" y1="180" x2="1300" y2="180"/>
    <line x1="100" y1="280" x2="1300" y2="280"/>
    <line x1="100" y1="380" x2="1300" y2="380"/>
    <line x1="100" y1="480" x2="1300" y2="480"/>
    <line x1="100" y1="580" x2="1300" y2="580"/>
  </g>
  
  <!-- Papers: MoE lane (y=150) -->
  <g>
    <!-- Adaptive MoE 1991 -->
    <rect class="node-rect" x="40" y="125" width="120" height="50" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="100" y="140" class="paper-label-bold">Adaptive MoE</text>
    <text x="100" y="158" class="paper-label">(1991)</text>
    <!-- Arrow to MoE 2017 -->
    <line x1="160" y1="150" x2="200" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- Sparsely-Gated MoE 2017 -->
    <rect class="node-rect" x="200" y="125" width="120" height="50" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="260" y="140" class="paper-label-bold">Sparsely-Gated MoE</text>
    <text x="260" y="158" class="paper-label">(2017)</text>
    <!-- Arrow to GLM-5 -->
    <line x1="260" y1="150" x2="1180" y2="150" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
    
    <!-- GLM-5 2026 -->
    <rect class="node-rect" x="1120" y="125" width="120" height="50" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="1180" y="140" class="paper-label-bold">GLM-5</text>
    <text x="1180" y="158" class="paper-label">(2026)</text>
  </g>
  
  <!-- Papers: Encoder lane (y=250) -->
  <g>
    <!-- ELMo 2018 -->
    <rect class="node-rect" x="270" y="225" width="120" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="330" y="240" class="paper-label-bold">ELMo</text>
    <text x="330" y="258" class="paper-label">(2018)</text>
    <line x1="330" y1="250" x2="300" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- BERT 2018 -->
    <rect class="node-rect" x="300" y="225" width="120" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="360" y="240" class="paper-label-bold">BERT</text>
    <text x="360" y="258" class="paper-label">(2018)</text>
    <line x1="360" y1="250" x2="420" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- T5 2019 -->
    <rect class="node-rect" x="420" y="225" width="120" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="480" y="240" class="paper-label-bold">T5</text>
    <text x="480" y="258" class="paper-label">(2019)</text>
    <line x1="480" y1="250" x2="440" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- BART 2019 -->
    <rect class="node-rect" x="440" y="225" width="120" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="500" y="240" class="paper-label-bold">BART</text>
    <text x="500" y="258" class="paper-label">(2019)</text>
  </g>
  
  <!-- Papers: Decoder lane (y=350) -->
  <g>
    <!-- GPT-1 2018 -->
    <rect class="node-rect" x="270" y="325" width="120" height="50" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="330" y="340" class="paper-label-bold">GPT-1</text>
    <text x="330" y="358" class="paper-label">(2018)</text>
    <line x1="330" y1="350" x2="500" y2="350" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
    
    <!-- GPT-3 2020 -->
    <rect class="node-rect" x="470" y="325" width="120" height="50" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="530" y="340" class="paper-label-bold">GPT-3</text>
    <text x="530" y="358" class="paper-label">(2020)</text>
    <line x1="530" y1="350" x2="700" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- InstructGPT 2022 -->
    <rect class="node-rect" x="670" y="325" width="120" height="50" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="730" y="340" class="paper-label-bold">InstructGPT</text>
    <text x="730" y="358" class="paper-label">(2022)</text>
    <line x1="730" y1="350" x2="800" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- PICL 2023 -->
    <rect class="node-rect" x="770" y="325" width="120" height="50" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="830" y="340" class="paper-label-bold">PICL</text>
    <text x="830" y="358" class="paper-label">(2023)</text>
    <line x1="830" y1="350" x2="820" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- DPO 2023 -->
    <rect class="node-rect" x="820" y="325" width="120" height="50" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="880" y="340" class="paper-label-bold">DPO</text>
    <text x="880" y="358" class="paper-label">(2023)</text>
    <line x1="880" y1="350" x2="840" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- IT Survey 2023 -->
    <rect class="node-rect" x="840" y="325" width="120" height="50" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="900" y="340" class="paper-label-bold">IT Survey</text>
    <text x="900" y="358" class="paper-label">(2023)</text>
  </g>
  
  <!-- Papers: Efficiency lane (y=450) -->
  <g>
    <!-- LoRA 2021 -->
    <rect class="node-rect" x="570" y="425" width="120" height="50" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="630" y="440" class="paper-label-bold">LoRA</text>
    <text x="630" y="458" class="paper-label">(2021)</text>
    <line x1="630" y1="450" x2="700" y2="450" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- FlashAttention 2022 (dashed border for "not in vault") -->
    <rect class="node-rect" x="670" y="425" width="120" height="50" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="730" y="440" class="paper-label-bold">FlashAttention</text>
    <text x="730" y="458" class="paper-label">(2022)</text>
    <line x1="730" y1="450" x2="800" y2="450" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- GQA 2023 -->
    <rect class="node-rect" x="770" y="425" width="120" height="50" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="830" y="440" class="paper-label-bold">GQA</text>
    <text x="830" y="458" class="paper-label">(2023)</text>
    <line x1="830" y1="450" x2="1000" y2="450" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
    
    <!-- SWAT 2025 -->
    <rect class="node-rect" x="970" y="425" width="120" height="50" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="1030" y="440" class="paper-label-bold">SWAT</text>
    <text x="1030" y="458" class="paper-label">(2025)</text>
  </g>
  
  <!-- Papers: Position lane (y=550) -->
  <g>
    <!-- Position Survey 2021 -->
    <rect class="node-rect" x="570" y="525" width="120" height="50" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="630" y="540" class="paper-label-bold">Position Survey</text>
    <text x="630" y="558" class="paper-label">(2021)</text>
    <line x1="630" y1="550" x2="620" y2="550" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- RoPE 2021 -->
    <rect class="node-rect" x="620" y="525" width="120" height="50" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="680" y="540" class="paper-label-bold">RoPE</text>
    <text x="680" y="558" class="paper-label">(2021)</text>
  </g>
  
  <!-- Legend -->
  <g font-family="Inter, sans-serif" font-size="11px" fill="#475569">
    <rect x="100" y="610" width="12" height="12" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="120" y="619" dominant-baseline="middle">MoE / Conditional Computation</text>
    <rect x="300" y="610" width="12" height="12" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="320" y="619" dominant-baseline="middle">Encoder / Seq2Seq</text>
    <rect x="500" y="610" width="12" height="12" rx="3" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="520" y="619" dominant-baseline="middle">Decoder-only / Alignment</text>
    <rect x="730" y="610" width="12" height="12" rx="3" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="750" y="619" dominant-baseline="middle">Efficiency / Attention</text>
    <rect x="970" y="610" width="12" height="12" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <text x="990" y="619" dominant-baseline="middle">Positional Geometry</text>
    <rect x="1200" y="610" width="12" height="12" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="1220" y="619" dominant-baseline="middle">Alignment / Future (dashed = not in vault)</text>
  </g>
</svg>